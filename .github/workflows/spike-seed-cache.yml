name: Spike seed - write pnpm store, lockfile verdict and node tool caches
# Adapted from upstream .github/workflows/pnpm-store-cache.yml (and the Node tool
# cache save in .github/actions/setup-pnpm). Upstream writes these on master; our
# runs are on a test branch, so write the same keys here once so the jest
# variants restore warm caches the way an upstream PR does.
on:
    workflow_dispatch:
    push:
        branches: [openscion-runner-spike]
        paths: ['.spike/run-seed']

permissions:
    contents: read

env:
    NPM_CONFIG_AUDIT: 'false'
    NPM_CONFIG_FUND: 'false'

jobs:
    write:
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - name: Install pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - name: Fix node-gyp permissions
              run: find ~/setup-pnpm -name gyp_main.py -exec chmod +x {} +
            - name: Set up Node.js
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version-file: .nvmrc
                  token: ${{ github.token }}
            - name: Resolve Node version
              id: node-version
              run: echo "version=$(tr -d 'v[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
            - name: Get pnpm store path
              id: pnpm-store
              run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
            - name: Get pnpm cache path
              id: pnpm-cache
              run: echo "path=$(pnpm cache path --silent)" >> "$GITHUB_OUTPUT"
            - name: Install into an empty store
              run: pnpm install --frozen-lockfile
            - name: Save pnpm store
              uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: ${{ steps.pnpm-store.outputs.path }}
                  key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
            - name: Save lockfile verdict
              uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: ${{ steps.pnpm-cache.outputs.path }}/lockfile-verified.jsonl
                  key: pnpm-verdict-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json') }}
            - name: Save Node tool cache
              uses: actions/cache/save@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
              with:
                  path: ${{ runner.tool_cache }}/node/${{ steps.node-version.outputs.version }}
                  key: node-toolcache-${{ runner.os }}-${{ runner.arch }}-${{ steps.node-version.outputs.version }}
